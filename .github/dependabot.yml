version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Framework upgrades get their own pull request (PRD: Technical requirements).
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["astro", "@astrojs/*"]
    open-pull-requests-limit: 5
