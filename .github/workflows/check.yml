name: Check

# Builds the site and checks it on every pull request, without deploying.
# Branch protection on main requires the "Build and link check" job to pass.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No token permissions beyond what each job asks for.
permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
      - name: Check internal links and anchors
        run: npm run check:links
