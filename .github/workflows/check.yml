name: Check

# Builds the site and checks it on every pull request, without deploying.
# Branch protection on main requires the "Build and link check" job to pass.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No token permissions beyond what each job asks for.
permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog page (FEAT-04)
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint Markdown and template sources
        run: npm run lint
      - name: Check generated control pages are up to date
        # Regenerates from the pinned NIST catalog; any diff means a page (or
        # a data file) was hand-edited inside the NIST markers or the
        # generator changed without regenerating.
        run: |
          npm run controls
          git diff --exit-code -- src/content/docs/controls src/data/control-ids.json src/data/catalog.json
      - name: Check generated template pages are up to date
        # Regenerates from templates/; any diff or new file means a page was
        # hand-edited or a source changed without running npm run templates.
        run: |
          npm run templates
          git add --intent-to-add src/content/docs/templates
          git diff --exit-code -- src/content/docs/templates
      - name: Install pandoc (pinned) for the .docx kit
        # Keep in step with deploy.yml. Checksum from the release's published sha256 digest.
        env:
          PANDOC_VERSION: '3.11'
          PANDOC_SHA256: 89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      - name: Build the site and the template kit
        run: npm run build
      - name: Check internal links and anchors
        run: npm run check:links
      - name: Check search finds control ids
        run: npm run check:search
      - name: Check accessibility (axe, light and dark themes)
        # pa11y-ci runs axe in headless Chrome, which Puppeteer downloads during npm ci.
        run: npm run check:a11y
