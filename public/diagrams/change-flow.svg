<rect x="380" y="202" width="140" height="56" rx="8" class="b"/><text x="450" y="226" text-anchor="middle" font-size="13">Record via CM</text><text x="450" y="244" text-anchor="middle" font-size="11.5" class="q">update SSP</text>
<rect x="566" y="202" width="168" height="56" rx="8" class="b"/><text x="650" y="226" text-anchor="middle" font-size="13">Continue monitoring</text><text x="650" y="244" text-anchor="middle" font-size="11.5" class="q">tasks M-2 to M-6</text>
<text x="550" y="102" text-anchor="middle" font-size="11.5" class="q">yes</text><text x="478" y="174" font-size="11.5" class="q">no</text><text x="250" y="282" text-anchor="middle" font-size="11.5" class="q">next change</text>
