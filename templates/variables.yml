# Organization-wide fill-in values, used in template sources as {{org:<key>}}.
# Each renders as a highlighted field showing its label, for example
# [Organization name]. Roles are titles, never names of people.
#
# Keys are lowercase with single hyphens. An unknown key fails the build.

name:
  label: Organization name
ciso:
  label: Chief Information Security Officer
  description: Title of the senior official accountable for the security program. Some organizations use Head of Security or Information Security Officer.
senior-leader:
  label: Senior leader
  description: Title of the executive who approves security policy for the organization, such as Chief Executive Officer, Chief Information Officer or agency head.
system-owner:
  label: System owner
  description: Title of the official responsible for a system's development, operation and security. Often the business or mission owner.
account-manager:
  label: Account manager
  description: Title of the person or team that creates, changes and removes accounts on a system, such as the identity team or system administrators.
supervisor:
  label: Supervisor
  description: Title of the person who manages a user's work and confirms their need for access, such as line manager or contract officer's representative.
security-operations:
  label: Security operations team
  description: Name of the team that monitors, reviews and analyzes security events, such as a security operations center or a managed security service.
incident-response-team:
  label: Incident response team
  description: Name of the team that handles incidents, such as a computer security incident response team (CSIRT), with its lead named in the incident response plan.
hr-office:
  label: Human resources office
  description: Name of the function that records hires, transfers and departures.
privacy-official:
  label: Senior privacy official
  description: Title of the official accountable for the privacy program, such as Chief Privacy Officer. In a federal agency, the Senior Agency Official for Privacy.
